<a class="skip-link" href="#contenido">Saltar al contenido</a>

<app-sidebar
  [items]="nav()"
  [userName]="nombre()"
  [userRole]="rol()"
  [opened]="sidebarOpen()"
  (closed)="closeSidebar()"
  (logout)="cerrarSesion()"
/>

<div class="dashboard">
  <app-topbar [title]="seccion().titulo" [subtitle]="seccion().subtitulo" (menuToggle)="toggleSidebar()" />
  <main id="contenido" class="dashboard__content" tabindex="-1">
    <router-outlet />
  </main>
</div>

<app-page-header
  title="Resumen del negocio"
  subtitle="Así se verán los indicadores del panel. Cada tarjeta es el mismo componente reutilizable."
  [breadcrumbs]="[{ label: 'Panel', route: '/dev/admin' }, { label: 'Resumen' }]"
>
  <button pageActions type="button" class="btn btn--secondary" (click)="toast.info('Actualizado', 'Datos al día de hoy.')">Actualizar</button>
  <button pageActions type="button" class="btn btn--primary" (click)="toast.success('Promoción creada', 'Ya aparece en el carrusel de inicio.')">Nueva promoción</button>
</app-page-header>

<div class="kpis">
  <app-kpi-card label="Ganancias del mes" value="S/ 12,480" [icon]="WalletIcon" tone="verde" [trend]="8.4" hint="vs. mes anterior" />
  <app-kpi-card label="Pedidos de hoy" value="42" [icon]="OrdersIcon" tone="rojo" [trend]="-3.1" hint="vs. ayer" />
  <app-kpi-card label="Pizza más vendida" value="Pepperoni" [icon]="PizzaIcon" tone="amarillo" hint="186 vendidas" />
  <app-kpi-card label="Pago a motorizados" value="S/ 1,320" [icon]="TruckIcon" hint="Semana actual" />
</div>

<section class="demo">
  <h2>Notificaciones</h2>
  <div class="demo__row">
    <button type="button" class="btn btn--primary btn--sm" (click)="toast.success('Pedido enviado', 'Tu pedido #1042 va camino a cocina.')">Éxito</button>
    <button type="button" class="btn btn--secondary btn--sm" (click)="toast.error('No se pudo pagar', 'Revisa los datos de tu tarjeta e inténtalo otra vez.')">Error</button>
    <button type="button" class="btn btn--secondary btn--sm" (click)="toast.warning('Stock web bajo', 'Quedan 5 masas para pedidos online hoy.')">Aviso</button>
    <button type="button" class="btn btn--secondary btn--sm" (click)="toast.info('Nueva promoción', 'Combo familiar disponible hasta las 23:00.')">Info</button>
  </div>
</section>

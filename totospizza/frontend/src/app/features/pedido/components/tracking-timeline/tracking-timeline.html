<ol class="etapas">
  @for (etapa of etapas(); track etapa.nombre; let i = $index) {
    <li class="etapa" [class.is-completa]="etapa.completada" [class.is-actual]="etapa.actual" [attr.aria-current]="etapa.actual ? 'step' : null">
      <span class="etapa__marca" aria-hidden="true">
        @if (etapa.completada) {
          <lucide-icon [img]="CheckIcon" [size]="16" [strokeWidth]="2.6"></lucide-icon>
        } @else {
          {{ i + 1 }}
        }
      </span>
      <span class="etapa__texto">
        <span class="etapa__nombre">{{ etapa.nombre }}</span>
        <span class="etapa__hora">
          @if (etapa.fecha) {
            {{ hora(etapa.fecha) }}
          } @else if (etapa.actual) {
            En curso
          } @else {
            Pendiente
          }
        </span>
        @if (etapa.actual) {
          <span class="etapa__ahora">Estás aquí</span>
        }
      </span>
    </li>
  }
</ol>

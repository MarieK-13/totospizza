<section class="benefits" aria-label="Por qué elegirnos">
  <ul class="benefits__card">
    @for (b of beneficios; track b.titulo) {
      <li class="benefit">
        <span class="benefit__icon" [class]="'benefit__icon benefit__icon--' + b.tono" aria-hidden="true">
          <lucide-icon [img]="b.icono" [size]="22" [strokeWidth]="1.5"></lucide-icon>
        </span>
        <div>
          <h3 class="benefit__title">{{ b.titulo }}</h3>
          <p class="benefit__text">{{ b.texto }}</p>
        </div>
      </li>
    }
  </ul>
</section>

<section class="cta" aria-labelledby="cta-titulo">
  <div class="cta__bg" aria-hidden="true">
    <img src="images/cta-pizza-box.jpg" alt="" loading="lazy" />
  </div>
  <div class="wrap cta__inner">
    <div class="cta__content">
      <span class="cta__tag">¿Ya se te antojó?</span>
      <h2 id="cta-titulo" class="cta__title">Tu pizza favorita, recién salida del horno de piedra</h2>
      <p class="cta__text">Elige, revisa los alérgenos y paga en línea. Te avisamos cuando entra al horno y cuando sale a tu puerta.</p>

      <div class="cta__actions">
        <a routerLink="/menu" class="btn btn--light btn--lg">
          Pedir ahora
          <lucide-icon [img]="ArrowRightIcon" [size]="18" [strokeWidth]="2" aria-hidden="true"></lucide-icon>
        </a>
        <a routerLink="/locales" class="btn btn--ghost btn--lg cta__ghost">Ver locales</a>
      </div>

      <ul class="cta__perks">
        @for (g of garantias; track g.texto) {
          <li>
            <lucide-icon [img]="g.icono" [size]="18" [strokeWidth]="1.5" aria-hidden="true"></lucide-icon>
            {{ g.texto }}
          </li>
        }
      </ul>
    </div>
  </div>
</section>

<a class="item" [class.is-curso]="enCurso()" [routerLink]="['/mis-pedidos', pedido().numero]">
  <span class="item__icono" aria-hidden="true">
    <lucide-icon [img]="delivery() ? BikeIcon : StoreIcon" [size]="20" [strokeWidth]="1.7"></lucide-icon>
  </span>
  <span class="item__texto">
    <span class="item__numero">Pedido {{ pedido().numero }}</span>
    <span class="item__meta">
      {{ fecha() }}, {{ pedido().cantidadItems }} {{ pedido().cantidadItems === 1 ? 'producto' : 'productos' }},
      {{ delivery() ? 'delivery' : 'recojo en tienda' }}
    </span>
  </span>
  <span class="item__estado" [class]="'item__estado item__estado--' + estado().tono">{{ estado().etiqueta }}</span>
  <span class="item__total">{{ total() }}</span>
  <lucide-icon class="item__flecha" [img]="ChevronIcon" [size]="18" [strokeWidth]="1.8" aria-hidden="true"></lucide-icon>
</a>

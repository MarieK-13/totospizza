<div class="clave">
  <div class="clave__fila">
    <span class="clave__icono" aria-hidden="true">
      <lucide-icon [img]="LockIcon" [size]="20" [strokeWidth]="1.7"></lucide-icon>
    </span>
    <div class="clave__texto">
      <p class="clave__titulo">Contraseña</p>
      <p class="clave__ayuda">Cámbiala si crees que alguien más la conoce.</p>
    </div>
    <button type="button" class="btn btn--secondary btn--sm" (click)="alternar()" [attr.aria-expanded]="abierto()" aria-controls="form-clave">
      {{ abierto() ? 'Cancelar' : 'Cambiar contraseña' }}
    </button>
  </div>

  @if (abierto()) {
    <form id="form-clave" class="clave__form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      @if (error(); as mensaje) {
        <div class="clave__alerta" role="alert">
          <lucide-icon [img]="AlertIcon" [size]="18" [strokeWidth]="1.8" aria-hidden="true"></lucide-icon>
          <p>{{ mensaje }}</p>
        </div>
      }
      <app-text-field formControlName="contrasenaActual" label="Contraseña actual" type="password" autocomplete="current-password" [required]="true" />
      <div class="clave__rejilla">
        <app-text-field formControlName="nuevaContrasena" label="Nueva contraseña" type="password" autocomplete="new-password"
          [maxlength]="72" [rules]="reglas" [required]="true" />
        <app-text-field formControlName="confirmarContrasena" label="Repite la nueva contraseña" type="password" autocomplete="new-password"
          [maxlength]="72" [required]="true" />
      </div>
      <div class="clave__acciones">
        <button type="submit" class="btn btn--primary clave__guardar" [disabled]="enviando()">
          {{ enviando() ? 'Actualizando…' : 'Actualizar contraseña' }}
        </button>
      </div>
    </form>
  }
</div>

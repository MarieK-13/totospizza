<div class="strength" [attr.data-nivel]="estado().nivel">
  <div class="strength__bars" aria-hidden="true">
    @for (tramo of tramos; track tramo) {
      <span class="strength__bar" [class.is-on]="tramo <= estado().nivel"></span>
    }
  </div>
  <p class="strength__text" aria-live="polite">
    @if (estado().nivel === 0) {
      Usa 8 o más caracteres con letras y números
    } @else {
      Seguridad: <strong>{{ estado().etiqueta }}</strong>
      @if (estado().falta; as falta) {
        <span class="strength__falta">· Falta: {{ falta.toLowerCase() }}</span>
      }
    }
  </p>
</div>

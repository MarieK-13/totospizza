<header class="site-header">
  <!-- Nivel 1: Barra / Aviso (Verde Albahaca) -->
  <div class="top-bar">
    <div class="top-bar__container">
      <div class="top-bar__location">
        <lucide-icon [img]="MapPinIcon" [size]="16" [strokeWidth]="1.5"></lucide-icon>
        <span>Entregando en <strong>Av. San Martín, Ica</strong></span>
        <button type="button" class="top-bar__change">Cambiar</button>
      </div>

      <p class="top-bar__promo">
        Envío gratis desde S/ 49 · Todos los días 12:00–23:00
      </p>
    </div>
  </div>

  <!-- Nivel 2: Encabezado Principal (Crema Masa + Borde Arena) -->
  <div class="main-header">
    <div class="main-header__container">
      <!-- Logo responsivo (Pantalla grande / Pantalla pequeña) -->
      <a routerLink="/" class="main-header__logo" aria-label="Inicio Toto's Pizza">
        <img
          src="images/logo-totosd.png"
          alt="Toto's Pizza - Pizza Artesanal"
          class="logo-desktop"
        />
        <img
          src="images/logo-totosm.png"
          alt="Toto's Pizza"
          class="logo-mobile"
        />
      </a>

      <!-- Navegación Desktop -->
      <nav class="main-header__nav" aria-label="Navegación principal">
        <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
        <a routerLink="/menu" routerLinkActive="is-active">Menú</a>
        <a routerLink="/locales" routerLinkActive="is-active">Locales</a>
        <a routerLink="/nosotros" routerLinkActive="is-active">Nosotros</a>
        <a routerLink="/arma-tu-pizza" routerLinkActive="is-active">Arma Tu Pizza</a>
      </nav>

      <!-- Acciones derecha (Usuario, Carrito y Botón Móvil) -->
      <div class="main-header__actions">
        <!-- Iniciar sesión -->
        <a routerLink="/login" class="user-btn">
          <lucide-icon [img]="UserIcon" [size]="20" [strokeWidth]="1.5" class="user-btn__icon"></lucide-icon>
          <div class="user-btn__text">
            <span class="user-btn__greeting">Hola!</span>
            <span class="user-btn__label">Iniciar sesión</span>
          </div>
        </a>

        <!-- Carrito (Píldora Beige Horno) -->
        <button type="button" class="cart-pill" aria-label="Ver carrito de compras">
          <lucide-icon [img]="CartIcon" [size]="20" [strokeWidth]="1.5"></lucide-icon>
          <span class="cart-pill__amount">S/ 0.00</span>
        </button>

        <!-- Botón Menú Hamburguesa (Solo móvil, según tu prototipo) -->
        <button
          type="button"
          class="mobile-toggle"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="mobileMenuOpen"
          aria-label="Abrir menú"
        >
          <lucide-icon [img]="mobileMenuOpen ? CloseIcon : MenuIcon" [size]="20" [strokeWidth]="1.5"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Menú desplegable móvil -->
    @if (mobileMenuOpen) {
      <nav class="mobile-drawer">
        <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="toggleMobileMenu()">Inicio</a>
        <a routerLink="/menu" routerLinkActive="is-active" (click)="toggleMobileMenu()">Menú</a>
        <a routerLink="/locales" routerLinkActive="is-active" (click)="toggleMobileMenu()">Locales</a>
        <a routerLink="/nosotros" routerLinkActive="is-active" (click)="toggleMobileMenu()">Nosotros</a>
        <a routerLink="/arma-tu-pizza" routerLinkActive="is-active" (click)="toggleMobileMenu()">Arma Tu Pizza</a>
        <a routerLink="/login" class="mobile-drawer__login" (click)="toggleMobileMenu()">
          <lucide-icon [img]="UserIcon" [size]="16" [strokeWidth]="1.5"></lucide-icon>
          <span>Iniciar sesión</span>
        </a>
      </nav>
    }
  </div>
</header>

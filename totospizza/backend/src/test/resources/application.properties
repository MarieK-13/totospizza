# Pruebas: base H2 en memoria, esquema generado por Hibernate (sin Flyway) y sin tareas programadas.
spring.datasource.url=jdbc:h2:mem:totospizza_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secreto=secreto-solo-para-pruebas-con-mas-de-32-caracteres
app.jobs.habilitados=false

spring.application.name=totospizza-estructura

# Perfil de desarrollo por defecto; en produccion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# --- Base de datos (variables de entorno; ver .vscode/launch.json) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:totospizza}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# Flyway crea/migra el esquema con el rol admin; la aplicacion usa el rol app en runtime.
# Si no se define DB_MIGRATION_USERNAME, Flyway usa las mismas credenciales de la aplicacion.
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.flyway.locations=classpath:db/migration

# El esquema lo gobierna Flyway; Hibernate solo verifica que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguridad ---
# JWT_SECRET (o APP_JWT_SECRET) debe tener al menos 32 caracteres.
app.jwt.secreto=${JWT_SECRET:${APP_JWT_SECRET:}}
app.jwt.acceso-duracion=15m
app.jwt.refresh-duracion=7d
app.cors.origenes-permitidos=http://localhost:4200

# --- Tareas programadas ---
app.jobs.habilitados=true
app.jobs.expiracion-pedidos-ms=60000
app.jobs.no-recogidos-ms=60000
app.jobs.conciliacion-pagos-ms=60000

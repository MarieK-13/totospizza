spring.application.name=totospizza-estructura

# Perfil de desarrollo por defecto; en produccion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# --- Base de datos (variables de entorno; ver .vscode/launch.json) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:totospizza}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# Flyway crea/migra el esquema con el rol admin; la aplicacion usa el rol app en runtime.
# Si no se define DB_MIGRATION_USERNAME, Flyway usa las mismas credenciales de la aplicacion.
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.flyway.locations=classpath:db/migration

# El esquema lo gobierna Flyway; Hibernate solo verifica que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguridad ---
# JWT_SECRET (o APP_JWT_SECRET) debe tener al menos 32 caracteres.
app.jwt.secreto=${JWT_SECRET:${APP_JWT_SECRET:}}
app.jwt.acceso-duracion=15m
app.jwt.refresh-duracion=7d
app.cors.origenes-permitidos=http://localhost:4200

# --- Tareas programadas ---
app.jobs.habilitados=true
app.jobs.expiracion-pedidos-ms=60000
app.jobs.no-recogidos-ms=60000
app.jobs.conciliacion-pagos-ms=60000

# --- Correo (recuperación de contraseña) ---
# Con MAIL_HABILITADO=false (por defecto) el enlace solo se escribe en el log del backend.
# Para Gmail: MAIL_USERNAME=tu_correo@gmail.com y MAIL_PASSWORD=contraseña de aplicación de 16 letras.
app.correo.habilitado=${MAIL_HABILITADO:false}
app.correo.remitente=${MAIL_USERNAME:}
app.correo.nombre-remitente=Toto's Pizza
app.correo.url-frontend=${APP_FRONTEND_URL:http://localhost:4200}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Imágenes subidas por el administrador (carpeta local; se sirven en /uploads/**) ---
app.archivos.directorio=${APP_ARCHIVOS_DIR:uploads}
app.archivos.tamano-maximo-imagen=2MB
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
